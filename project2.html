<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Multiplying</h1>
    <p id="demo"></p>
    <button onclick="mult(3)">Click Me!!</button>
    <script>
        function mult(a,b){
            if (b === undefined){
                alert("b is undefined")
                b=12
            }
            var product = a*b
            document.getElementById("demo").innerHTML = product
        }
    </script>
</body>
</html>
